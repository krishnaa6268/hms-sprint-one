<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="admin_style.css">
</head>

<body data-page="admin-login">
  <header class="header">
    <a class="brand" href="../index.html">Hotel Reservation System</a>

    <div>
      <span id="welcome" class="welcome"></span>
    </div>
  </header>

  <main class="container">
    <section class="card center auth-card">
      <img
        class="auth-image"
        src="https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&amp;fit=crop&amp;w=900&amp;q=80"
        alt="Luxury hotel reception"
      >
      <h1>Admin Login</h1>
 <button class="btn-secondary" type="button" data-theme-toggle>Dark mode</button>
      <p class="small">
        Default admin credentials: admin01 / Admin@123
      </p>

      <form id="loginForm">
        <div class="grid" style="text-align: left;">
          <div class="full">
            <label for="loginUserId">User ID</label>
            <input
              id="loginUserId"
              minlength="5"
              maxlength="20"
            
            >
          </div>

          <div class="full">
            <label for="loginPassword">Password</label>
            <input
              id="loginPassword"
              type="password"
              maxlength="30"
         
            >
          </div>
        </div>

        <div id="message"></div>

        <div class="actions" style="justify-content: center;">
          <button type="submit">Login</button>
          <a class="btn btn-secondary" href="../index.html">Back</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    Customer and Admin Reservation Portal
  </footer>

  <script src="../common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
