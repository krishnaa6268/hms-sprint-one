<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Register</title>
  <link rel="stylesheet" href="customer_style.css">
</head>
<!-- KARTIK  -->
<body data-page="customer-complaint">
  <header class="header">
    <a class="brand" href="../index.html">Hotel Reservation System</a>

    <div>
      <span id="welcome" class="welcome"></span>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <nav class="nav">
      <a href="customer-home.html">Home</a>
      <a href="customer-reservation.html">Reservation</a>
      <a href="customer-billing.html">Billing Page</a>
      <a href="customer-history.html">History</a>
      <a href="customer-bookings.html">Bookings</a>
      <a href="customer-support.html">Contact Support</a>
      <a class="btn-danger" href="#" onclick="logout()">Logout</a>
    </nav>

    <section class="card">
      <h1>Complaint Register Page</h1>

      <form id="complaintForm">
        <div class="grid">
          <div>
            <label>Type of Complaint</label>
            <select required>
              <option value="">Select</option>
              <option>Room Cleanliness</option>
              <option>Service Delay</option>
              <option>Billing Issue</option>
              <option>Food Quality</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label>Room Number</label>
            <input
              type="number"
              min="101"
              max="304"
              placeholder="101"
              required
            >
          </div>

          <div>
            <label>Customer Contact Number</label>
            <input
              type="tel"
              inputmode="numeric"
              maxlength="10"
              pattern="[0-9]{10}"
              placeholder="9123456677"
              required
            >
          </div>

          <div>
            <label>Customer ID</label>
            <input
              id="customerId"
              minlength="5"
              maxlength="20"
              placeholder="Customer ID"
              readonly
              required
            >
          </div>

          <div class="full">
            <label>Complaint Details</label>
            <textarea
              minlength="10"
              maxlength="500"
              placeholder="Describe your complaint"
              required
            ></textarea>
          </div>
        </div>

        <div id="message"></div>

        <div class="actions">
          <button type="submit">Register Complaint</button>
          <a class="btn btn-secondary" href="customer-support.html">
            Back to Support
          </a>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    Customer and Admin Reservation Portal
  </footer>
  <script src="../common.js"></script>
  <script src="../Customer/customer.js"></script>
</body>
</html>
