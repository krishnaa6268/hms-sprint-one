<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Payment</title>
  <link rel="stylesheet" href="customer_style.css">
</head>

<body data-page="customer-card">
  <header class="header">
    <a class="brand" href="../index.html">Hotel Reservation System</a>

    <div>
      <span id="welcome" class="welcome"></span>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <nav class="nav">
      <a href="customer-home.html">Home</a>
      <a href="customer-reservation.html">Reservation</a>
      <a href="customer-billing.html">Billing Page</a>
      <a href="customer-history.html">History</a>
      <a href="customer-bookings.html">Bookings</a>
      <a href="customer-support.html">Contact Support</a>
      <a class="btn-danger" href="#" onclick="logout()">Logout</a>
    </nav>

    <section class="card">
      <h1>Credit Card Payment</h1>

      <p>
        <strong>Bill Amount:</strong>
        <span id="amount"></span>
      </p>

      <form id="cardForm">
        <div class="grid">
          <div class="full">
            <label>Credit Card</label>
            <span class="small">Enter card details below</span>
          </div>

          <div>
            <label>Card No</label>
            <input
              id="cardNo"
              type="text"
              inputmode="numeric"
              maxlength="16"
              pattern="[0-9]{16}"
              placeholder="1234567890123456"
              required
            >
          </div>

          <div>
            <label>Card Holder Name</label>
            <input
              id="cardHolder"
              type="text"
              minlength="3"
              maxlength="50"
              pattern="[A-Za-z][A-Za-z .'-]{1,49}"
              placeholder="Name on card"
              required
            >
          </div>

          <div>
            <label>Expiry Date</label>
            <input
              id="expiry"
              placeholder="MM/YY"
              maxlength="5"
              pattern="(0[1-9]|1[0-2])/[0-9]{2}"
              required
            >
          </div>

          <div>
            <label>CVV</label>
            <input
              id="cvv"
              type="password"
              inputmode="numeric"
              placeholder="123"
              maxlength="3"
              pattern="[0-9]{3}"
              required
            >
          </div>
        </div>

        <div id="message"></div>

        <div class="actions">
          <button type="submit">Make Payment</button>
          <a class="btn btn-secondary" href="customer-billing.html">Back</a>
        </div>
      </form>

      <div id="paymentResult"></div>
    </section>
  </main>

  <footer class="footer">
    Customer and Admin Reservation Portal
  </footer>
   <script src="../common.js"></script>
  <script src="../Customer/customer.js"></script>
</body>
</html>
